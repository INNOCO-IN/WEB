<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style id="in-mobile">
@media (max-width: 1000px){
  [style*="grid-template-columns: 1.05fr 1fr"]{grid-template-columns:1fr !important;}
  [style*="grid-template-columns: 1fr 1fr"]{grid-template-columns:1fr !important;}
  [style*="grid-template-columns: 1.05fr"]{grid-template-columns:1fr !important;}
  [style*="width: 800px"]{width:auto !important;max-width:100% !important;}
  [style*="width: 1200px"]{width:auto !important;max-width:100% !important;}
  [style*="width: 1000px"]{width:auto !important;max-width:100% !important;}
  [style*="width: 950px"]{width:auto !important;max-width:100% !important;}
  [style*="height: 350px"],[style*="height: 250px"],[style*="height: 200px"],[style*="height: 180px"],[style*="height: 170px"],[style*="height: 130px"],[style*="height: 100px"]{height:auto !important;min-height:0 !important;}
}
@media (max-width: 600px){
  [style*="padding: 70px 28px"]{padding:44px 20px !important;}
  [style*="padding: 72px 28px"]{padding:44px 20px !important;}
  [style*="padding: 66px 28px"]{padding:40px 20px !important;}
  [style*="padding: 62px 28px"]{padding:40px 20px !important;}
  [style*="padding: 60px 44px"]{padding:36px 24px !important;}
  [style*="padding: 40px 44px"]{padding:28px 22px !important;}
  [style*="padding: 52px 28px"]{padding:36px 20px !important;}
}
</style>
</helmet>
<header style="position: sticky; top: 0; z-index: 200; background: rgba(250,244,226,0.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid rgba(46,59,64,0.12);">
  <div style="max-width: 1320px; margin: 0 auto; padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; gap: 28px; flex-wrap: wrap;">

    <a href="Home.EN.dc.html" style="display: inline-flex; align-items: center; text-decoration: none; flex: 0 0 auto;">
      <img src="IN_Logo.png" alt="IN.studio — home" style="height: 34px; width: auto; display: block;">
    </a>

    <nav style="display: flex; align-items: flex-start; gap: 30px; flex-wrap: wrap;">
      <sc-for list="{{ groups }}" as="group" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-start;">
          <div style="{{ group.kwStyle }}">{{ group.keyword }}</div>
          <div style="display: flex; align-items: center; gap: 13px; flex-wrap: nowrap;">
            <sc-for list="{{ group.dots }}" as="dot" hint-placeholder-count="3">
              <a href="{{ dot.href }}" onMouseEnter="{{ dot.onEnter }}" onMouseLeave="{{ dot.onLeave }}" onClick="{{ dot.onClick }}" aria-label="{{ dot.name }}" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none; padding: 6px; margin: -6px;">
                <span style="{{ dot.dotStyle }}"></span>
              </a>
            </sc-for>
            <span style="{{ group.labelStyle }}">{{ group.labelText }}</span>
          </div>
        </div>
      </sc-for>
    </nav>

    <a href="Are-you-IN.EN.dc.html" style="flex: 0 0 auto; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; line-height: 1.3; text-transform: uppercase; white-space: nowrap; color: #2E3B40; border: 1.5px solid #2E3B40; border-radius: 999px; padding: 10px 24px; text-decoration: none;">Are you IN?</a>
  </div>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1320, &quot;height&quot;: 120}}">
class Component extends DCLogic {
  state = { hg: null, hd: null };

  onDotClick(e, gi, di) {
    const canHover = window.matchMedia && window.matchMedia('(hover: hover)').matches;
    if (!canHover && !(this.state.hg === gi && this.state.hd === di)) {
      e.preventDefault();
      this.setState({ hg: gi, hd: di });
    }
  }

  renderVals() {
    let current = '';
    try { current = decodeURIComponent((location.pathname.split('/').pop() || '')); } catch (e) {}
    const GREY = 'rgba(46,59,64,0.55)';
    const DARK = '#2E3B40';
    const KW = "font-family:'Archivo',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; white-space:nowrap; transition:color 0.18s ease; ";
    const data = [
      { keyword: 'Start Within', dots: [
        { name: 'Manifesto', href: 'Manifesto.EN.dc.html', color: '#1E8A86' },
        { name: 'Collectives', href: 'Collectives.EN.dc.html', color: '#46325A' },
        { name: 'ME=WE', href: 'ME=WE.EN.dc.html', color: '#1E648C' },
      ]},
      { keyword: 'Share the Space', dots: [
        { name: 'Workshop', href: 'Workshop.EN.dc.html', color: '#E6328C' },
        { name: 'Story', href: 'Story.EN.dc.html', color: '#FAB414' },
        { name: 'Protagonist', href: 'Protagonist.EN.dc.html', color: '#F05A28' },
      ]},
      { keyword: 'Serve the Whole', dots: [
        { name: 'Project', href: 'Project.EN.dc.html', color: '#1E5A64' },
        { name: 'Community', href: 'Community.EN.dc.html', color: '#D21E28' },
        { name: 'Constellation', href: 'Constellation.EN.dc.html', color: '#F0D23C' },
      ]},
    ];
    const hovering = this.state.hg !== null;

    const groups = data.map((g, gi) => {
      const groupHovered = hovering && this.state.hg === gi;
      const activeIdx = g.dots.findIndex(d => d.href === current);
      const showIdx = groupHovered ? this.state.hd : ((!hovering && activeIdx >= 0) ? activeIdx : -1);
      const labelDot = showIdx >= 0 ? g.dots[showIdx] : null;
      return {
        keyword: g.keyword,
        kwStyle: KW + 'color:' + (groupHovered ? DARK : GREY) + ';',
        labelText: labelDot ? labelDot.name : '\u00A0',
        labelStyle: "width:118px; overflow:hidden; white-space:nowrap; font-family:'Archivo',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; transition:opacity 0.16s ease; color:" + (labelDot ? labelDot.color : GREY) + "; opacity:" + (labelDot ? "1" : "0") + ";",
        dots: g.dots.map((d, di) => {
          const isHovered = groupHovered && this.state.hd === di;
          const active = d.href === current;
          const lit = isHovered || (active && !hovering);
          return {
            name: d.name,
            href: d.href,
            dotStyle: 'width:10px; height:10px; border-radius:50%; flex:0 0 auto; transition:background 0.18s ease; background:' + (lit ? d.color : GREY) + ';',
            onEnter: () => this.setState({ hg: gi, hd: di }),
            onLeave: () => this.setState({ hg: null, hd: null }),
            onClick: (e) => this.onDotClick(e, gi, di),
          };
        }),
      };
    });
    return { groups };
  }
}
</script>
</body>
</html>
