<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/in-design-system-94f9dcdd-24c7-4f2a-93c7-7cddcb619c0e/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/in-design-system-94f9dcdd-24c7-4f2a-93c7-7cddcb619c0e/tokens/colors.css">
  <link rel="stylesheet" href="_ds/in-design-system-94f9dcdd-24c7-4f2a-93c7-7cddcb619c0e/tokens/typography.css">
  <link rel="stylesheet" href="_ds/in-design-system-94f9dcdd-24c7-4f2a-93c7-7cddcb619c0e/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/in-design-system-94f9dcdd-24c7-4f2a-93c7-7cddcb619c0e/styles.css">
  <script src="_ds/in-design-system-94f9dcdd-24c7-4f2a-93c7-7cddcb619c0e/_ds_bundle.js"></script>
</helmet>
<header style="position:sticky;top:0;left:0;right:0;zIndex:50;background:rgba(250,244,226,0.88);backdropFilter:blur(8px);borderBottom:1px solid var(--color-ink-12);boxSizing:border-box;height:76px" onMouseLeave="{{ onLeave }}">
  <div style="maxWidth:var(--content-max-width);margin:0 auto;display:flex;alignItems:center;justifyContent:space-between;gap:24px;padding:16px var(--content-side-padding);height:44px">
    <a href="IN Website 2026 C.dc.html" style="display:flex;alignItems:center;gap:10px;textDecoration:none;color:var(--color-ink)">
      <img src="assets/in-mark-web.png" alt="IN" style="height:26px;width:auto;display:block">
    </a>
    <nav style="display:flex;alignItems:center;gap:6px;height:100%">
      <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="6">
        <div style="position:relative;height:100%;display:flex;alignItems:center" onMouseEnter="{{ item.onEnter }}">
          <sc-if value="{{ item.isConnect }}" hint-placeholder-val="{{ false }}">
            <a href="{{ item.href }}" style="{{ item.linkStyle }}">{{ item.label }}</a>
          </sc-if>
          <sc-if value="{{ item.isPlain }}" hint-placeholder-val="{{ true }}">
            <a href="{{ item.href }}" style="{{ item.linkStyle }}">{{ item.label }}</a>
          </sc-if>
          <sc-if value="{{ item.hasMega }}" hint-placeholder-val="{{ false }}">
            <sc-if value="{{ item.isOpen }}" hint-placeholder-val="{{ false }}">
              <div style="{{ item.panelWrapStyle }}">
                <div style="maxWidth:var(--content-max-width);margin:0 auto;padding:36px var(--content-side-padding) 40px;display:flex;gap:56px">
                  <div style="flex:0 0 260px;display:flex;flexDirection:column;gap:14px">
                    <div style="font:var(--text-eyebrow);letterSpacing:var(--tracking-eyebrow);textTransform:uppercase;color:var(--color-teal)">{{ item.eyebrow }}</div>
                    <div style="font:600 26px/1.25 var(--font-serif);color:var(--color-ink)">{{ item.desc }}</div>
                  </div>
                  <div style="flex:1;display:grid;gridTemplateColumns:repeat(2,minmax(0,1fr));gap:28px 40px">
                    <sc-for list="{{ item.links }}" as="l" hint-placeholder-count="4">
                      <a href="{{ l.href }}" style="display:block;textDecoration:none;color:var(--color-ink);paddingBottom:14px;borderBottom:1px solid var(--color-ink-12)">
                        <div style="font:600 18px/1.3 var(--font-serif)">{{ l.title }}</div>
                        <div style="font:var(--text-body);fontFamily:var(--font-serif);color:rgba(26,22,19,0.62);marginTop:4px">{{ l.desc }}</div>
                      </a>
                    </sc-for>
                  </div>
                </div>
              </div>
            </sc-if>
          </sc-if>
        </div>
      </sc-for>
    </nav>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:76},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { openIndex: null };

  getRawItems() {
    return [
      {
        label: 'ABOUT IN', href: 'About IN.dc.html', hasMega: true,
        eyebrow: 'ABOUT IN', desc: 'A small studio with a long question.',
        links: [
          { title: 'About IN', desc: 'Who we are, and how we practice ME=WE.', href: 'About IN.dc.html' },
          { title: 'IN Manifesto', desc: 'Nine movements — the long-form companion.', href: 'IN Manifesto.dc.html' },
          { title: 'History of IN', desc: 'A practice that kept traveling.', href: 'History of IN.dc.html' },
          { title: 'IN-Collectives + Core Team', desc: 'The people carrying this work forward.', href: 'IN Collectives.dc.html' },
        ],
      },
      {
        label: 'ME=WE', href: 'ME-WE.dc.html', hasMega: true,
        eyebrow: 'ME=WE', desc: 'One path. No sides.',
        links: [
          { title: 'ME=WE', desc: 'The relational pattern, and why it matters.', href: 'ME-WE.dc.html' },
          { title: 'ME=WE Pathway', desc: 'One path, four depths of commitment.', href: 'ME-WE Pathway.dc.html' },
        ],
      },
      {
        label: 'WORKSHOP', href: 'Workshop.dc.html', hasMega: true,
        eyebrow: 'WORKSHOP', desc: 'Where practice becomes a lifestyle.',
        links: [
          { title: 'Workshop', desc: 'All workshops, starting with Möbius Making.', href: 'Workshop.dc.html' },
          { title: 'Möbius Making', desc: 'Core workshop. Start here.', href: 'Mobius Making.dc.html' },
          { title: 'Pathfinder', desc: 'Facilitator training.', href: 'Pathfinder.dc.html' },
          { title: 'METANOIA', desc: 'Change from within. Four days.', href: 'Metanoia.dc.html' },
          { title: 'Jungle Jam', desc: 'A residential gathering for young people.', href: 'Jungle Jam.dc.html' },
        ],
      },
      {
        label: 'STORY', href: 'Story.dc.html', hasMega: true,
        eyebrow: 'STORY', desc: 'Stories told by everyone. Owned by no one.',
        links: [
          { title: 'Story', desc: 'Index — Signature Story featured, plus tagged card archive.', href: 'Story.dc.html' },
          { title: 'Constellation', desc: 'ME=WE Universe Virtual Exhibition.', href: 'Constellation.dc.html' },
          { title: 'Story Submission', desc: 'Read. Share. Fifteen minutes is enough.', href: 'Story Submission.dc.html' },
        ],
      },
      {
        label: 'COMMUNITY', href: 'Community.dc.html', hasMega: true,
        eyebrow: 'COMMUNITY', desc: 'Where the practice took root.',
        links: [
          { title: 'Community', desc: 'Projects still going, and the ones that grew roots.', href: 'Community.dc.html' },
          { title: 'Food Revolution', desc: 'KULNA Community Garden, Zayed University.', href: 'Food Revolution.dc.html' },
          { title: 'UAE Youth Camp', desc: 'Social Innovation Bootcamp, Sharjah.', href: 'UAE Youth Camp.dc.html' },
          { title: 'UNC Social Innovation', desc: 'UAE / Nepal / Connect, 2016–2018.', href: 'UNC Social Innovation.dc.html' },
        ],
      },
      { label: 'CONNECT', href: 'Connect.dc.html', hasMega: false, isConnect: true },
    ];
  }

  renderVals() {
    const active = this.props.active || '';
    const openIndex = this.state.openIndex;
    const baseLink = {
      textDecoration: 'none', display: 'inline-flex', alignItems: 'center', height: '100%',
      font: 'var(--text-nav)', fontFamily: 'var(--font-sans)', letterSpacing: '0.02em',
      padding: '0 16px', boxSizing: 'border-box',
    };
    const navItems = this.getRawItems().map((it, i) => {
      const isActive = it.label === active;
      const isOpen = openIndex === i;
      let linkStyle;
      if (it.isConnect) {
        linkStyle = {
          font: 'var(--text-button)', fontFamily: 'var(--font-sans)', letterSpacing: 'var(--tracking-button)',
          textDecoration: 'none', background: isActive ? 'var(--color-teal-dark)' : 'var(--color-ink)',
          color: 'var(--color-paper)', borderRadius: 'var(--radius-pill)', padding: '11px 22px',
        };
      } else {
        linkStyle = {
          ...baseLink,
          color: isActive || isOpen ? 'var(--color-teal)' : 'var(--color-ink)',
          borderBottom: isActive ? '2px solid var(--color-teal)' : '2px solid transparent',
        };
      }
      return {
        ...it,
        isPlain: !it.isConnect,
        isOpen,
        linkStyle,
        panelWrapStyle: {
          position: 'fixed', left: 0, right: 0, top: 76, background: 'rgba(250, 244, 226, 0.96)', backdropFilter: 'blur(8px)',
          borderBottom: '1px solid var(--color-ink-12)', boxShadow: 'var(--shadow-hover)', zIndex: 49,
        },
        onEnter: () => this.setState({ openIndex: it.hasMega ? i : null }),
      };
    });
    return { navItems, onLeave: () => this.setState({ openIndex: null }) };
  }
}
</script>
</body>
</html>
